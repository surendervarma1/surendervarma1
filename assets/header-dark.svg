<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Surender Varma Bollampally header (dark)">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#64748b" stroke-opacity="0.28" stroke-width="1"/>
    </pattern>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="26" fill="url(#grid)" opacity="0.6"/>

  <g opacity="0.20">
    <path d="M0 190 C 220 140, 340 268, 545 216 C 770 160, 930 58, 1200 120 L 1200 260 L 0 260 Z" fill="#7c3aed"/>
  </g>
  <g opacity="0.18">
    <path d="M0 212 C 260 135, 470 298, 710 192 C 900 122, 990 62, 1200 80 L 1200 260 L 0 260 Z" fill="#06b6d4"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="44" y="40" width="1112" height="180" rx="22" fill="#0f172a" opacity="0.92"/>
  </g>

  <text x="88" y="108"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial"
        font-size="44" font-weight="800" fill="#e5e7eb">
    Surender Varma Bollampally

  <text x="88" y="152"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial"
        font-size="22" font-weight="600" fill="#cbd5e1">
    M.S. Computer Engineering @ SDSU • Edge/IoT • Databases • Machine Learning
  </text>

  <rect x="88" y="176" width="360" height="10" rx="5" fill="url(#accent)"/>
  <!-- Minimal icon set (right side) -->
  <g  transform="translate(872 70)" fill="none" stroke="#e5e7eb" stroke-width="3" opacity="0.82">
    <rect x="0" y="0" width="72" height="72" rx="16"/>
    <path d="M16 24 h40"/>
    <path d="M16 38 h40"/>
    <path d="M16 52 h26"/>

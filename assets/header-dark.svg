  <g transform="translate(960 70)" fill="none" stroke="#e5e7eb" stroke-width="3" opacity="0.82">
    <rect x="0" y="0" width="72" height="72" rx="16"/>
    <circle cx="36" cy="27" r="10"/>
    <path d="M19 56 h34"/>
